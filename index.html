<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Notas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Sistema de Notas</h1>

        <p>Digite os dados do aluno para calcular a média.</p>

        <form action="/calcular" method="POST">

            <label>Nome do aluno:</label>
            <input type="text" name="nome" required>

            <label>Primeira nota:</label>
            <input type="number" name="nota1" min="0" max="10" step="0.1" required>

            <label>Segunda nota:</label>
            <input type="number" name="nota2" min="0" max="10" step="0.1" required>

            <label>Terceira nota:</label>
            <input type="number" name="nota3" min="0" max="10" step="0.1" required>

            <button type="submit">Calcular Média</button>

        </form>

    </div>

</body>
</html>
